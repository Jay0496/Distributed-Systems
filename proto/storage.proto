syntax = "proto3";
package storage;
option go_package = "./proto";

service StorageService {
  rpc Put (PutRequest) returns (PutResponse);
  rpc Get (GetRequest) returns (GetResponse);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);

  // Join asks the current leader to add a new voter to the Raft cluster.
  rpc Join (JoinRequest) returns (JoinResponse);

  // NodeStatus reports the local node's Raft state for diagnostics and tests.
  rpc NodeStatus (NodeStatusRequest) returns (NodeStatusResponse);

  // Fragment streaming is the transport used by the redundancy engine to
  // move Reed-Solomon data and parity chunks between nodes.
  //
  // Fragment identity is the pair (stripe_id, shard_index). Shard indices are
  // global: 0, 1, 2 are RS data shards, 3 and 4 are RS parity shards, and all
  // five indices are full copies in replication mode. Legacy key/index/
  // is_parity fields remain for wire compatibility but are ignored by v2.
  rpc UploadFragment (stream FragmentChunk) returns (FragmentResponse);
  rpc DownloadFragment (FragmentRequest) returns (stream FragmentChunk);

  // DeleteFragment removes one local fragment. It is idempotent.
  rpc DeleteFragment (DeleteFragmentRequest) returns (FragmentOpResponse);

  // DeleteStripeFragments removes every local fragment for a stripe. It is
  // used by overwrite garbage collection and is idempotent.
  rpc DeleteStripeFragments (DeleteStripeFragmentsRequest) returns (FragmentOpResponse);

  // ListFragments streams local fragment references. An empty stripe_id lists
  // every local fragment; repair uses it to detect missing local shards.
  rpc ListFragments (ListFragmentsRequest) returns (stream FragmentInfo);

  // StatFragment reports size and checksum without transferring the payload.
  rpc StatFragment (DeleteFragmentRequest) returns (FragmentInfo);

  // Repair is the entry point for the failure-management subsystem to ask a
  // node to rebuild a missing fragment.
  rpc Repair (RepairRequest) returns (RepairResponse);
}

message PutRequest {
  string key = 1;
  bytes value = 2;
  string mode = 3; // "replication" or "rs32"; empty resolves from cluster config
  // Optional compare-and-swap guard. Zero means no guard. A non-zero value must
  // equal the currently stored version or the write is rejected as a conflict.
  int64 expected_version = 4;
}

message PutResponse {
  bool success = 1;
  string message = 2;
  // Identity and durability of the stripe created by a successful write.
  string stripe_id = 3;
  string mode = 4;
  int64 version = 5;
  bool degraded = 6;
  int32 shards_stored = 7;
  string checksum = 8;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool success = 1;
  bytes value = 2;
}

message HeartbeatRequest {
  string node_id = 1;
}

message HeartbeatResponse {
  bool alive = 1;
}

message JoinRequest {
  string node_id = 1;
  string raft_addr = 2;
  string grpc_addr = 3;
}

message JoinResponse {
  bool success = 1;
  string message = 2;
  string leader_id = 3;
}

message NodeStatusRequest {}

message NodeStatusResponse {
  string node_id = 1;
  string state = 2;
  string leader_id = 3;
  string leader_addr = 4;
  uint64 term = 5;
  uint64 commit_index = 6;
  uint64 applied_index = 7;
  uint64 last_index = 8;
}

message FragmentChunk {
  // Legacy v1 fields. Kept so existing clients compile and old wire messages
  // remain decodable; v2 servers ignore key, index, and is_parity on upload.
  string key = 1 [deprecated = true];
  int32 index = 2 [deprecated = true];
  bytes data = 3;
  bool is_parity = 4 [deprecated = true];

  // Global stripe identity. shard_index is 0..4 in both redundancy modes.
  string stripe_id = 5;
  int32 shard_index = 6;

  // SHA-256 hex digest of the complete fragment. Repeated on every chunk and
  // verified before the staged fragment is committed.
  string checksum = 7;

  // Byte offset of this chunk within the complete fragment and the total
  // fragment size. Chunks must arrive in order with no gaps or overlaps.
  int64 offset = 8;
  int64 total_size = 9;

  // Set on the final chunk of an upload.
  bool last = 10;

  // Repair only: allow replacing an existing fragment with a different
  // checksum. Ordinary writes must always send false.
  bool replace = 11;
}

message FragmentResponse {
  bool success = 1;
  string message = 2;
}

message FragmentRequest {
  string key = 1 [deprecated = true];
  int32 index = 2 [deprecated = true];
  string stripe_id = 3;
  int32 shard_index = 4;
}

// FragmentInfo describes a locally stored fragment without its payload.
message FragmentInfo {
  string stripe_id = 1;
  int32 shard_index = 2;
  bool is_parity = 3;
  int64 size = 4;
  string checksum = 5;
}

message DeleteFragmentRequest {
  string stripe_id = 1;
  int32 shard_index = 2;
}

message DeleteStripeFragmentsRequest {
  string stripe_id = 1;
}

message ListFragmentsRequest {
  // Empty lists every local fragment.
  string stripe_id = 1;
}

message FragmentOpResponse {
  bool success = 1;
  string message = 2;
}

message RepairRequest {
  string key = 1;
}

message RepairResponse {
  bool success = 1;
  string message = 2;
}
