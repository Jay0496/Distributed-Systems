syntax = "proto3";
package storage;
option go_package = "./proto";

service StorageService {
  rpc Put (PutRequest) returns (PutResponse);
  rpc Get (GetRequest) returns (GetResponse);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
}

message PutRequest {
  string key = 1;
  bytes value = 2;
  string mode = 3; // "replication" or "rs32"
}

message PutResponse {
  bool success = 1;
  string message = 2;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool success = 1;
  bytes value = 2;
}

message HeartbeatRequest {
  string node_id = 1;
}

message HeartbeatResponse {
  bool alive = 1;
}