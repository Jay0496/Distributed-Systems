syntax = "proto3";
package storage;
option go_package = "./proto";

service StorageService {
  rpc Put (PutRequest) returns (PutResponse);
  rpc Get (GetRequest) returns (GetResponse);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);

  // Join asks the current leader to add a new voter to the Raft cluster.
  rpc Join (JoinRequest) returns (JoinResponse);

  // NodeStatus reports the local node's Raft state for diagnostics and tests.
  rpc NodeStatus (NodeStatusRequest) returns (NodeStatusResponse);

  // Fragment streaming is the transport used by the redundancy engine to
  // move Reed-Solomon data and parity chunks between nodes.
  //
  // Fragment identity is the pair (stripe_id, shard_index). Shard indices are
  // global: 0, 1, 2 are RS data shards, 3 and 4 are RS parity shards, and all
  // five indices are full copies in replication mode. Legacy key/index/
  // is_parity fields remain for wire compatibility but are ignored by v2.
  rpc UploadFragment (stream FragmentChunk) returns (FragmentResponse);
  rpc DownloadFragment (FragmentRequest) returns (stream FragmentChunk);

  // DeleteFragment removes one local fragment. It is idempotent.
  rpc DeleteFragment (DeleteFragmentRequest) returns (FragmentOpResponse);

  // DeleteStripeFragments removes every local fragment for a stripe. It is
  // used by overwrite garbage collection and is idempotent.
  rpc DeleteStripeFragments (DeleteStripeFragmentsRequest) returns (FragmentOpResponse);

  // ListFragments streams local fragment references. An empty stripe_id lists
  // every local fragment; repair uses it to detect missing local shards.
  rpc ListFragments (ListFragmentsRequest) returns (stream FragmentInfo);

  // StatFragment reports size and checksum without transferring the payload.
  rpc StatFragment (DeleteFragmentRequest) returns (FragmentInfo);

  // Repair is the entry point for the failure-management subsystem to ask a
  // node to rebuild a missing fragment.
  rpc Repair (RepairRequest) returns (RepairResponse);

  // Delete removes a key's committed metadata and then garbage-collects the
  // stripe's fragments on their owners. It is idempotent.
  rpc Delete (DeleteRequest) returns (DeleteResponse);

  // GetConfig returns the cluster-wide default redundancy mode. The leader
  // serves a linearizable read through Raft; followers forward.
  rpc GetConfig (GetConfigRequest) returns (ConfigResponse);

  // SetConfig replaces the cluster-wide default redundancy mode through Raft.
  // Only the leader commits; followers forward.
  rpc SetConfig (SetConfigRequest) returns (ConfigResponse);

  // ClusterHealth reports the leader, global mode, node health, and degraded
  // state. Followers forward because only the leader has a complete view.
  rpc ClusterHealth (ClusterHealthRequest) returns (ClusterHealthResponse);

  // Stats reports local storage and repair counters. Any node may answer.
  rpc Stats (StatsRequest) returns (StatsResponse);

  // ForceSnapshot compacts this node's Raft state into a new snapshot. It is
  // local to the addressed node and is used by the benchmark harness before
  // measuring storage. It never forwards and never blocks the leader.
  rpc ForceSnapshot (ForceSnapshotRequest) returns (ForceSnapshotResponse);

  // CheckpointStore truncates this node's SQLite write-ahead log and reports
  // the remaining database size. It is local and used before a storage
  // measurement so WAL noise does not inflate the result.
  rpc CheckpointStore (CheckpointRequest) returns (CheckpointResponse);
}

message PutRequest {
  string key = 1;
  bytes value = 2;
  string mode = 3; // "replication" or "rs32"; empty resolves from cluster config
  // Optional compare-and-swap guard. Zero means no guard. A non-zero value must
  // equal the currently stored version or the write is rejected as a conflict.
  int64 expected_version = 4;
}

message PutResponse {
  bool success = 1;
  string message = 2;
  // Identity and durability of the stripe created by a successful write.
  string stripe_id = 3;
  string mode = 4;
  int64 version = 5;
  bool degraded = 6;
  int32 shards_stored = 7;
  string checksum = 8;
}

message GetRequest {
  string key = 1;
  // Optional read hint. The server always uses the mode recorded in committed
  // metadata, so this field does not affect correctness.
  string mode = 2;
}

message GetResponse {
  bool success = 1;
  bytes value = 2;
  // Details of the stripe that served the read.
  string mode = 3;
  string stripe_id = 4;
  int64 version = 5;
  int32 shards_used = 6;
  bool repaired = 7;
  string checksum = 8;
}

message HeartbeatRequest {
  string node_id = 1;
}

message HeartbeatResponse {
  bool alive = 1;
}

message JoinRequest {
  string node_id = 1;
  string raft_addr = 2;
  string grpc_addr = 3;
}

message JoinResponse {
  bool success = 1;
  string message = 2;
  string leader_id = 3;
}

message NodeStatusRequest {}

message NodeStatusResponse {
  string node_id = 1;
  string state = 2;
  string leader_id = 3;
  string leader_addr = 4;
  uint64 term = 5;
  uint64 commit_index = 6;
  uint64 applied_index = 7;
  uint64 last_index = 8;
}

message FragmentChunk {
  // Legacy v1 fields. Kept so existing clients compile and old wire messages
  // remain decodable; v2 servers ignore key, index, and is_parity on upload.
  string key = 1 [deprecated = true];
  int32 index = 2 [deprecated = true];
  bytes data = 3;
  bool is_parity = 4 [deprecated = true];

  // Global stripe identity. shard_index is 0..4 in both redundancy modes.
  string stripe_id = 5;
  int32 shard_index = 6;

  // SHA-256 hex digest of the complete fragment. Repeated on every chunk and
  // verified before the staged fragment is committed.
  string checksum = 7;

  // Byte offset of this chunk within the complete fragment and the total
  // fragment size. Chunks must arrive in order with no gaps or overlaps.
  int64 offset = 8;
  int64 total_size = 9;

  // Set on the final chunk of an upload.
  bool last = 10;

  // Repair only: allow replacing an existing fragment with a different
  // checksum. Ordinary writes must always send false.
  bool replace = 11;
}

message FragmentResponse {
  bool success = 1;
  string message = 2;
}

message FragmentRequest {
  string key = 1 [deprecated = true];
  int32 index = 2 [deprecated = true];
  string stripe_id = 3;
  int32 shard_index = 4;
}

// FragmentInfo describes a locally stored fragment without its payload.
message FragmentInfo {
  string stripe_id = 1;
  int32 shard_index = 2;
  bool is_parity = 3;
  int64 size = 4;
  string checksum = 5;
}

message DeleteFragmentRequest {
  string stripe_id = 1;
  int32 shard_index = 2;
}

message DeleteStripeFragmentsRequest {
  string stripe_id = 1;
}

message ListFragmentsRequest {
  // Empty lists every local fragment.
  string stripe_id = 1;
}

message FragmentOpResponse {
  bool success = 1;
  string message = 2;
}

message RepairRequest {
  string key = 1;
  // Optional stripe precision. When set it must match the key's current stripe.
  string stripe_id = 2;
  // Re-encode and replace even when the target fragment is present. Requires a
  // verified source value; used for corrupt-shard reports and operator drills.
  bool force = 3;
}

message RepairResponse {
  bool success = 1;
  string message = 2;
}

message GetConfigRequest {}

message ConfigResponse {
  // default_mode is the cluster-wide mode used when a Put omits a mode.
  string default_mode = 1;
  bool success = 2;
  string message = 3;
  // leader_id identifies the node that committed or read the config.
  string leader_id = 4;
}

message SetConfigRequest {
  // default_mode must be "rs32" or "replication"; empty is rejected.
  string default_mode = 1;
}

message DeleteRequest {
  string key = 1;
  // Optional compare-and-delete guard. Zero means unconditional; a non-zero
  // value must equal the stored version or the delete fails with Aborted.
  int64 expected_version = 2;
}

message DeleteResponse {
  bool success = 1;
  string message = 2;
  // old_stripe_id names the stripe whose fragments were garbage-collected.
  string old_stripe_id = 3;
  // found is false when the key was already absent. Delete is idempotent.
  bool found = 4;
}

message StatsRequest {}

message StatsResponse {
  string node_id = 1;
  string mode = 2;
  bool leader = 3;
  uint64 keys = 4;
  uint64 stripes = 5;
  uint64 fragments = 6;
  uint64 storage_bytes = 7;
  uint64 repair_queue_depth = 8;
  uint64 repairs_completed = 9;
  uint64 repairs_failed = 10;
  int64 uptime_seconds = 11;
  // fragment_bytes is the payload bytes stored in this node's fragments table.
  // It excludes SQLite page and WAL overhead; storage_bytes includes both.
  uint64 fragment_bytes = 12;
}

message ForceSnapshotRequest {}

message ForceSnapshotResponse {
  bool success = 1;
  string message = 2;
  // last_index is the Raft last log index when the snapshot completed.
  uint64 last_index = 3;
}

message CheckpointRequest {}

message CheckpointResponse {
  bool success = 1;
  string message = 2;
  // bytes_after is the database size in bytes after the WAL checkpoint.
  int64 bytes_after = 3;
}

message ClusterHealthRequest {}

message NodeHealth {
  string node_id = 1;
  string grpc_addr = 2;
  string raft_state = 3;
  bool healthy = 4;
  bool leader = 5;
  int64 last_seen_unix = 6;
  uint64 fragments = 7;
  uint64 storage_bytes = 8;
  string error = 9;
}

message ClusterHealthResponse {
  bool success = 1;
  string leader_id = 2;
  string mode = 3;
  // degraded is true when any node is unhealthy or any stripe is degraded.
  bool degraded = 4;
  uint32 healthy_nodes = 5;
  uint32 total_nodes = 6;
  repeated NodeHealth nodes = 7;
  uint64 degraded_stripes = 8;
  uint64 repair_queue_depth = 9;
  string message = 10;
}
